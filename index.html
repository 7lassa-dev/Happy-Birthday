<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Happy Birthday!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --night1:#1a1442;
    --night2:#2d1b69;
    --night3:#16213e;
    --pink:#ff6ec7;
    --pink-dark:#c2399b;
    --yellow:#ffd93d;
    --yellow-dark:#d9a300;
    --cyan:#4ecdc4;
    --cyan-dark:#2a8f88;
    --purple:#a685e2;
    --white:#fff6f9;
    --outline:#1a1442;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,110,199,0.12), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(78,205,196,0.12), transparent 40%),
      linear-gradient(180deg, var(--night1) 0%, var(--night2) 55%, var(--night3) 100%);
    font-family:'Press Start 2P', monospace;
    image-rendering: pixelated;
    position:relative;
  }

  /* ---------- STARFIELD ---------- */
  .stars{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:3px; height:3px;
    background:var(--white);
    box-shadow:0 0 4px 1px rgba(255,255,255,0.8);
    animation: twinkle 2.2s infinite ease-in-out;
  }
  .star.big{ width:5px; height:5px; }
  @keyframes twinkle{
    0%,100%{ opacity:0.25; transform:scale(0.8);}
    50%{ opacity:1; transform:scale(1.4);}
  }

  /* shooting star */
  .shooting-star{
    position:absolute;
    top:10%;
    left:-10%;
    width:60px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--white) 60%, var(--white));
    border-radius:2px;
    opacity:0;
    animation: shoot 6s linear infinite;
    animation-delay: 1s;
  }
  .shooting-star::after{
    content:'';
    position:absolute;
    right:-2px; top:-2px;
    width:6px; height:6px;
    background:var(--white);
    border-radius:50%;
    box-shadow:0 0 8px 2px var(--white);
  }
  @keyframes shoot{
    0%{ opacity:0; transform: translate(0,0); }
    5%{ opacity:1; }
    25%{ opacity:1; transform: translate(140vw, 90px); }
    26%{ opacity:0; }
    100%{ opacity:0; }
  }

  /* ---------- GROUND / GRID FLOOR ---------- */
  .floor{
    position:absolute;
    bottom:0; left:0; right:0;
    height:32%;
    background:
      linear-gradient(180deg, rgba(45,27,105,0) 0%, rgba(45,27,105,0.6) 100%),
      repeating-linear-gradient(90deg, rgba(255,110,199,0.35) 0 2px, transparent 2px 60px),
      repeating-linear-gradient(0deg, rgba(255,110,199,0.35) 0 2px, transparent 2px 40px);
    background-color: rgba(22,33,62,0.4);
    transform: perspective(220px) rotateX(55deg);
    transform-origin: bottom;
    border-top: 3px solid var(--pink);
    box-shadow: 0 -10px 40px rgba(255,110,199,0.25);
  }

  /* ---------- CLOUDS (pixel) ---------- */
  .cloud{
    position:absolute;
    image-rendering: pixelated;
    opacity:0.9;
    animation: drift linear infinite;
  }
  .cloud svg{ display:block; width:100%; height:100%; }
  @keyframes drift{
    0%{ transform: translateX(-120px); }
    100%{ transform: translateX(120vw); }
  }

  /* ---------- CONFETTI ---------- */
  .confetti{
    position:absolute;
    top:-20px;
    width:8px; height:8px;
    opacity:0.95;
    animation: fall linear infinite;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1;}
    100%{ transform: translateY(115vh) rotate(720deg); opacity:0.9;}
  }

  /* ---------- CENTER STAGE ---------- */
  .stage{
    position:relative;
    z-index:5;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 18px;
    padding: 20px;
    text-align:center;
  }

  .title-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
    width:100%;
    max-width: 100vw;
  }

  h1.hbd{
    margin:0;
    font-size: clamp(14px, 6vw, 30px);
    line-height:1.6;
    letter-spacing: 2px;
    color: var(--white);
    -webkit-text-stroke: 2px var(--outline);
    white-space:normal;
    text-align:center;
    max-width: 90vw;
  }

  @media (max-width: 480px){
    h1.hbd{
      letter-spacing: 0px;
      -webkit-text-stroke: 1.5px var(--outline);
      max-width: 95vw;
    }
    h1.hbd span{
      text-shadow:
        2px 2px 0 var(--pink-dark),
        4px 4px 0 var(--purple),
        0 0 14px rgba(255,255,255,0.5);
    }
  }
  h1.hbd span{
    display:inline-block;
    text-shadow:
      3px 3px 0 var(--pink-dark),
      6px 6px 0 var(--purple),
      0 0 18px rgba(255,255,255,0.5);
    animation: letter-wave 1.6s ease-in-out infinite, letter-rainbow 1.6s ease-in-out infinite;
  }
  @keyframes letter-wave{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-14px); }
  }
  @keyframes letter-rainbow{
    0%,100%{ color:var(--white); }
    20%{ color:var(--pink); }
    40%{ color:var(--yellow); }
    60%{ color:var(--cyan); }
    80%{ color:var(--purple); }
  }

  .sparkle{
    position:absolute;
    font-size: 14px;
    color: var(--yellow);
    animation: sparkle-anim 1.4s ease-in-out infinite;
    pointer-events:none;
    z-index:6;
  }

  .corner-box{
    position:fixed;
    width:200px;
    height:200px;
    z-index:4;
    background:transparent;
  }
    video {
    mix-blend-mode: screen;
  }
  .corner-box.tl{ top:0; left:0; }
  .corner-box.tr{ top:0; right:0; }
  .corner-box.bl{ bottom:0; left:0; }
  .corner-box.br{ bottom:0; right:0; }
  .corner-box video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  @keyframes sparkle-anim{
    0%,100%{ opacity:0; transform: scale(0.4) rotate(0deg); }
    50%{ opacity:1; transform: scale(1.1) rotate(90deg); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="shooting-star"></div>

  <!-- clouds -->
  <div class="cloud" style="top:14%; width:90px; height:40px; animation-duration:38s;">
    <svg viewBox="0 0 32 16" xmlns="http://www.w3.org/2000/svg">
      <g fill="#ffffff" opacity="0.85">
        <rect x="6" y="6" width="20" height="6"/>
        <rect x="9" y="3" width="6" height="3"/>
        <rect x="16" y="3" width="6" height="3"/>
        <rect x="3" y="9" width="26" height="3"/>
      </g>
    </svg>
  </div>
  <div class="cloud" style="top:30%; width:70px; height:32px; animation-duration:48s; animation-delay:-10s;">
    <svg viewBox="0 0 32 16" xmlns="http://www.w3.org/2000/svg">
      <g fill="#ffffff" opacity="0.7">
        <rect x="6" y="6" width="20" height="6"/>
        <rect x="9" y="3" width="6" height="3"/>
        <rect x="16" y="3" width="6" height="3"/>
        <rect x="3" y="9" width="26" height="3"/>
      </g>
    </svg>
  </div>
  <div class="cloud" style="top:8%; left:5%; width:60px; height:28px; animation-duration:55s; animation-delay:-25s;">
    <svg viewBox="0 0 32 16" xmlns="http://www.w3.org/2000/svg">
      <g fill="#ffffff" opacity="0.6">
        <rect x="6" y="6" width="20" height="6"/>
        <rect x="9" y="3" width="6" height="3"/>
        <rect x="16" y="3" width="6" height="3"/>
        <rect x="3" y="9" width="26" height="3"/>
      </g>
    </svg>
  </div>

  <div class="floor"></div>

  <!-- confetti container-->
  <div id="confettiLayer"></div>

  <!-- sparkles around the card -->
  <div class="sparkle" style="top:18%; left:20%;">✦</div>
  <div class="sparkle" style="top:70%; left:15%; animation-delay:0.4s;">✦</div>
  <div class="sparkle" style="top:22%; left:78%; animation-delay:0.7s;">✦</div>
  <div class="sparkle" style="top:68%; left:82%; animation-delay:1s;">✦</div>
  <div class="sparkle" style="top:45%; left:6%; animation-delay:0.3s;">✧</div>
  <div class="sparkle" style="top:50%; left:94%; animation-delay:0.9s;">✧</div>

  <div class="corner-box tl">
    <video autoplay loop muted playsinline >
    <source src="Malphite_4.webm" type="video/webm">
    </video>
  </div>
  <div class="corner-box tr"></div>
  <div class="corner-box bl"></div>
  <div class="corner-box br"></div>

  <div class="stage">
    <div class="title-wrap">
      <h1 class="hbd" id="hbdText"></h1>
    </div>
  </div>

<script>
  //main text animation 
  const text = "HAPPY BIRTHDAY";
  const hbdContainer = document.getElementById('hbdText');
  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.08) + 's';
    hbdContainer.appendChild(span);
  });
  //Stars
  const starsLayer = document.getElementById('stars');
  const starCount = 70;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star' + (Math.random() > 0.85 ? ' big' : '');
    s.style.top = Math.random() * 75 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (1.6 + Math.random() * 2) + 's';
    starsLayer.appendChild(s);
  }
  //Confetti  
  const confettiLayer = document.getElementById('confettiLayer');
  const colors = ['#ff6ec7', '#ffd93d', '#4ecdc4', '#a685e2', '#fff6f9'];
  const shapes = ['square', 'circle'];
  const confettiCount = 45;
  for (let i = 0; i < confettiCount; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const color = colors[Math.floor(Math.random() * colors.length)];
    c.style.background = color;
    c.style.left = Math.random() * 100 + '%';
    c.style.animationDuration = (3 + Math.random() * 4) + 's';
    c.style.animationDelay = (Math.random() * 6) + 's';
    c.style.width = c.style.height = (5 + Math.random() * 5) + 'px';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    confettiLayer.appendChild(c);
  }
</script>

</body>
</html>
